<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Snake Game - Deluxe Edition</title>
  <style>
    :root {
      --bg-color: #0b0d14;
      --card-bg: #121520;
      --panel-bg: rgba(22, 27, 42, 0.75);
      --border-color: #1f263b;
      --border-accent: #2e3856;
      --text-main: #f0f4fc;
      --text-sub: #8d9bb0;
      --text-label: #5e6d8a;
      --overlay-bg: rgba(11, 13, 20, 0.94);
      --grid-line: #161c2e;
      --accent-green: #00e676;
      --accent-gold: #ffd700;
      --accent-cyan: #00e5ff;
    }

    [data-theme="light"] {
      --bg-color: #f4f6fb;
      --card-bg: #ffffff;
      --panel-bg: rgba(235, 240, 248, 0.85);
      --border-color: #d1d9e6;
      --border-accent: #b8c4d8;
      --text-main: #101828;
      --text-sub: #475467;
      --text-label: #667085;
      --overlay-bg: rgba(244, 246, 251, 0.94);
      --grid-line: #e4e9f2;
      --accent-green: #00a854;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 440px;
      padding: 14px;
    }

    .score-board {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 10px 16px;
      background: var(--panel-bg);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-sub);
    }

    .score-board span {
      color: var(--accent-green);
      font-size: 16px;
    }

    .coin-badge {
      color: var(--accent-gold) !important;
      font-weight: 800;
    }

    .audio-btn {
      background: transparent;
      border: none;
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 6px;
      transition: transform 0.1s ease;
    }

    .audio-btn:active {
      transform: scale(0.85);
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      border: 2px solid var(--border-color);
      transition: transform 0.05s ease-out;
    }

    .canvas-wrapper.shake {
      animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .achievements-container {
      display: none;
      justify-content: space-between;
      gap: 6px;
      width: 100%;
    }

    .achievements-container.active {
      display: flex;
    }

    .achievement-badge {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 2px;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      opacity: 0.25;
      filter: grayscale(100%);
      transition: all 0.4s ease;
    }

    .achievement-badge .badge-icon {
      font-size: 14px;
      line-height: 1;
      margin-bottom: 2px;
    }

    .achievement-badge .badge-name {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-label);
    }

    .achievement-badge.unlocked {
      opacity: 1;
      filter: grayscale(0%);
      border-color: currentColor;
    }

    .achievement-badge.bronze.unlocked { color: #cd7f32; border-color: #cd7f32; }
    .achievement-badge.silver.unlocked { color: #c0c0c0; border-color: #c0c0c0; }
    .achievement-badge.gold.unlocked { color: #ffd700; border-color: #ffd700; }
    .achievement-badge.platinum.unlocked { color: #e5e4e2; border-color: #e5e4e2; }
    .achievement-badge.titanium.unlocked { color: #87ceeb; border-color: #87ceeb; }

    .combo-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 100%;
      height: 38px;
    }

    .combo-gauge-container {
      width: 100%;
      height: 6px;
      background: var(--panel-bg);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid var(--border-accent);
    }

    .combo-gauge-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00e676, #00e5ff);
      box-shadow: 0 0 10px #00e676;
      transition: width 0.05s linear;
    }

    /* Green color and smooth scaling animation for combo target */
    .combo-text-display {
      font-size: 15px;
      font-weight: 900;
      color: #00e676;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(0, 230, 118, 0.8);
      min-height: 20px;
      display: inline-block;
    }

    .combo-text-display.pulse-active {
      animation: comboPulse 0.8s ease-in-out infinite alternate;
    }

    @keyframes comboPulse {
      0% {
        transform: scale(1);
        text-shadow: 0 0 8px rgba(0, 230, 118, 0.6);
      }
      100% {
        transform: scale(1.22);
        text-shadow: 0 0 18px rgba(0, 230, 118, 1);
      }
    }

    .powerup-bar-container {
      display: flex;
      gap: 8px;
      width: 100%;
      min-height: 28px;
      justify-content: center;
    }

    .powerup-active-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--panel-bg);
      border: 1px solid var(--border-accent);
      padding: 4px 12px;
      border-radius: 14px;
      font-size: 11px;
      font-weight: 800;
      color: var(--text-main);
      backdrop-filter: blur(6px);
    }

    .powerup-active-badge .pu-timer {
      color: var(--accent-gold);
      font-family: monospace;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: var(--overlay-bg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(8px);
      transition: opacity 0.3s ease;
      z-index: 10;
      padding: 16px;
      text-align: center;
      overflow-y: auto;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .typography-title {
      font-size: clamp(26px, 8vw, 36px);
      font-weight: 900;
      letter-spacing: 3px;
      line-height: 1.2;
      padding: 4px 0;
      background: linear-gradient(135deg, #00e676, #00e5ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      filter: drop-shadow(0 0 10px rgba(0, 230, 118, 0.4));
      margin: 0;
    }

    .home-highscore-badge {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--text-sub);
      background: var(--panel-bg);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--border-accent);
    }

    .home-highscore-badge span {
      color: var(--accent-gold);
    }

    .menu-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 260px;
    }

    .setting-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-label);
      margin-bottom: 2px;
      text-align: left;
      font-weight: 800;
    }

    .option-selector {
      display: flex;
      background: var(--panel-bg);
      border-radius: 10px;
      padding: 3px;
      gap: 4px;
      border: 1px solid var(--border-color);
    }

    .option-btn {
      flex: 1;
      padding: 6px 0;
      font-size: 11px;
      font-weight: 700;
      border: none;
      background: transparent;
      color: var(--text-sub);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option-btn.active {
      background: var(--accent-green);
      color: #fff;
      box-shadow: 0 2px 10px rgba(0, 230, 118, 0.3);
    }

    .action-btn-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-width: 260px;
      margin-top: 2px;
    }

    .action-btn {
      padding: 10px;
      width: 100%;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: var(--accent-green);
      color: #0b0d14;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 230, 118, 0.3);
      transition: transform 0.1s, filter 0.2s;
    }

    .action-btn.secondary {
      background: var(--panel-bg);
      color: var(--text-sub);
      box-shadow: none;
      border: 1px solid var(--border-accent);
    }

    .action-btn.shop-btn {
      background: #ff9800;
      color: #fff;
      box-shadow: 0 4px 16px rgba(255, 152, 0, 0.3);
    }

    .action-btn.share-btn {
      background: var(--panel-bg);
      color: var(--accent-gold);
      border: 1px solid var(--accent-gold);
      box-shadow: 0 2px 10px rgba(255, 215, 0, 0.15);
    }

    .action-btn:active {
      transform: scale(0.97);
    }

    .shop-modal {
      position: absolute;
      inset: 0;
      background: var(--overlay-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      z-index: 20;
      backdrop-filter: blur(10px);
      overflow-y: auto;
    }

    .shop-modal.hidden {
      display: none;
    }

    .shop-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 320px;
      margin-bottom: 12px;
    }

    .shop-title {
      font-size: 20px;
      font-weight: 900;
      color: #ff9800;
      letter-spacing: 2px;
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 320px;
    }

    .shop-item {
      background: var(--panel-bg);
      border: 2px solid var(--border-accent);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .shop-item.equipped {
      border-color: var(--accent-green);
      box-shadow: 0 0 12px rgba(0, 230, 118, 0.3);
    }

    .snake-preview {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .shop-item-name {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-main);
    }

    .shop-item-btn {
      padding: 6px 8px;
      font-size: 10px;
      font-weight: 800;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      width: 100%;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }

    .shop-item-btn.buy { background: var(--accent-gold); color: #000; }
    .shop-item-btn.equip { background: #2196f3; color: #fff; }
    .shop-item-btn.equipped { background: var(--accent-green); color: #fff; cursor: default; }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 8px;
      width: 180px;
      height: 110px;
      margin-top: 4px;
    }

    .btn {
      background: var(--panel-bg);
      border: 1px solid var(--border-accent);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
    }

    .btn:active {
      filter: brightness(1.3);
      transform: scale(0.95);
    }

    .btn-up { grid-column: 2; grid-row: 1; }
    .btn-left { grid-column: 1; grid-row: 2; }
    .btn-down { grid-column: 2; grid-row: 2; }
    .btn-right { grid-column: 3; grid-row: 2; }

    @media (min-width: 768px) {
      .controls { display: none; }
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="score-board">
      <div>SCORE: <span id="score">0</span></div>
      <div>COINS: <span id="coins" class="coin-badge">🪙 0</span></div>
      <div>BEST: <span id="high-score">0</span></div>
      <button class="audio-btn" id="audio-toggle-btn" onclick="toggleAudio()" title="Toggle Sound">🔊</button>
    </div>

    <div id="achievements-bar" class="achievements-container">
      <div id="ach-bronze" class="achievement-badge bronze">
        <span class="badge-icon">🥉</span>
        <span class="badge-name">Bronze</span>
      </div>
      <div id="ach-silver" class="achievement-badge silver">
        <span class="badge-icon">🥈</span>
        <span class="badge-name">Silver</span>
      </div>
      <div id="ach-gold" class="achievement-badge gold">
        <span class="badge-icon">🥇</span>
        <span class="badge-name">Gold</span>
      </div>
      <div id="ach-platinum" class="achievement-badge platinum">
        <span class="badge-icon">💎</span>
        <span class="badge-name">Plat</span>
      </div>
      <div id="ach-titanium" class="achievement-badge titanium">
        <span class="badge-icon">🛡️</span>
        <span class="badge-name">Titan</span>
      </div>
    </div>

    <div class="canvas-wrapper" id="canvas-wrapper">
      <canvas id="gameCanvas" width="400" height="400"></canvas>

      <div id="overlay" class="overlay">
        <h1 class="typography-title" id="overlay-title">SNAKE</h1>
        
        <div class="home-highscore-badge" id="home-highscore-container">
          BEST SCORE: <span id="home-high-score">0</span>
        </div>

        <div class="menu-group" id="menu-settings">
          <div>
            <div class="setting-label">Theme</div>
            <div class="option-selector">
              <button class="option-btn active" id="theme-dark-btn" onclick="setTheme('dark')">Dark</button>
              <button class="option-btn" id="theme-light-btn" onclick="setTheme('light')">Light</button>
            </div>
          </div>
          <div>
            <div class="setting-label">Difficulty</div>
            <div class="option-selector">
              <button class="option-btn active" onclick="setDifficulty('easy')">Easy</button>
              <button class="option-btn" onclick="setDifficulty('medium')">Medium</button>
              <button class="option-btn" onclick="setDifficulty('hard')">Hard</button>
            </div>
          </div>
          <div>
            <div class="setting-label">Walls</div>
            <div class="option-selector">
              <button class="option-btn active" onclick="setWalls(true)">On</button>
              <button class="option-btn" onclick="setWalls(false)">Off</button>
            </div>
          </div>
        </div>

        <div class="action-btn-group">
          <button class="action-btn" id="start-btn" onclick="handlePrimaryAction()">Start Game</button>
          <button class="action-btn shop-btn" id="open-shop-btn" onclick="toggleShop(true)">Snake Shop 🛒</button>
          <button class="action-btn share-btn" id="share-btn" onclick="generateShareCard()">Share High Score 📸</button>
          <button class="action-btn secondary" id="home-btn" style="display: none;" onclick="returnToHome()">Home Screen</button>
        </div>
      </div>

      <div id="shop-modal" class="shop-modal hidden">
        <div class="shop-header">
          <div class="shop-title">SNAKE SHOP</div>
          <div class="home-highscore-badge">🪙 <span id="shop-coins">0</span></div>
        </div>
        <div class="shop-grid" id="shop-grid"></div>
        <button class="action-btn secondary" style="margin-top: 12px; max-width: 200px;" onclick="toggleShop(false)">Back to Menu</button>
      </div>
    </div>

    <div class="combo-wrapper">
      <div class="combo-gauge-container">
        <div id="combo-gauge" class="combo-gauge-bar"></div>
      </div>
      <div id="combo-display" class="combo-text-display"></div>
    </div>

    <div class="powerup-bar-container" id="powerup-bar"></div>

    <div class="controls">
      <button class="btn btn-up" id="btn-up">▲</button>
      <button class="btn btn-left" id="btn-left">◀</button>
      <button class="btn btn-down" id="btn-down">▼</button>
      <button class="btn btn-right" id="btn-right">▶</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const coinsEl = document.getElementById('coins');
    const shopCoinsEl = document.getElementById('shop-coins');
    const highScoreEl = document.getElementById('high-score');
    const homeHighScoreEl = document.getElementById('home-high-score');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const startBtn = document.getElementById('start-btn');
    const shareBtn = document.getElementById('share-btn');
    const homeBtn = document.getElementById('home-btn');
    const openShopBtn = document.getElementById('open-shop-btn');
    const shopModal = document.getElementById('shop-modal');
    const shopGrid = document.getElementById('shop-grid');
    const menuSettings = document.getElementById('menu-settings');
    const comboDisplay = document.getElementById('combo-display');
    const comboGauge = document.getElementById('combo-gauge');
    const achievementsBar = document.getElementById('achievements-bar');
    const powerupBar = document.getElementById('powerup-bar');
    const canvasWrapper = document.getElementById('canvas-wrapper');

    const GRID_SIZE = 20;
    const TILE_COUNT = canvas.width / GRID_SIZE;

    let audioEnabled = true;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (!audioEnabled) return;
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'eat') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'bonus') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
      } else if (type === 'powerup') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.linearRampToValueAtTime(500, now + 0.15);
        osc.frequency.linearRampToValueAtTime(800, now + 0.3);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      } else if (type === 'gameover') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.4);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
      }
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      document.getElementById('audio-toggle-btn').textContent = audioEnabled ? '🔊' : '🔇';
    }

    let particles = [];
    let floatingTexts = [];

    function spawnParticles(x, y, color, count = 10) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3 + 1;
        particles.push({
          x: (x + 0.5) * GRID_SIZE,
          y: (y + 0.5) * GRID_SIZE,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color: color,
          alpha: 1.0,
          radius: Math.random() * 3 + 2
        });
      }
    }

    function spawnFloatingText(x, y, text, color) {
      floatingTexts.push({
        x: (x + 0.5) * GRID_SIZE,
        y: y * GRID_SIZE,
        text: text,
        color: color,
        alpha: 1.0,
        vy: -1.2
      });
    }

    function updateAndDrawFX() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.025;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.alpha -= 0.02;

        if (ft.alpha <= 0) {
          floatingTexts.splice(i, 1);
          continue;
        }

        ctx.globalAlpha = ft.alpha;
        ctx.font = '900 13px sans-serif';
        ctx.fillStyle = ft.color;
        ctx.textAlign = 'center';
        ctx.fillText(ft.text, ft.x, ft.y);
      }

      ctx.globalAlpha = 1.0;
    }

    const SNAKE_SHOP_SKINS = {

      lightblue: { name: 'Cyan Sky', head: '#00e5ff', body: '#18ffff', price: 25 },
      orange: { name: 'Neon Orange', head: '#ff9100', body: '#ffd180', price: 35 },

    const POWERUP_TYPES = {
      SCORE_X10: { type: 'SCORE_X10', label: '10x Score', icon: '⚡', color: '#ffd700', duration: 10000, despawn: 5000 },

    };

    let currentTheme = localStorage.getItem('snake_theme') || 'dark';
    let coins = parseInt(localStorage.getItem('snake_coins')) || 0;

    let equippedSkin = localStorage.getItem('snake_equipped_skin') || 'green';

    let selectedDifficulty = 'easy';
    let hasWalls = true;
    let stepInterval = 140;
    let baseScoreValue = 5;

    let snake = [];
    let food = { x: 0, y: 0 };
    let bonusFood = null;
    let bonusTimer = null;
    let ateCount = 0;
    
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    
    let lastStepTime = 0;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('snake_high_score')) || 0;
    let isRunning = false;
    let isPaused = false;

    let activeBuffs = { SCORE_X10: 0, GHOST: 0, COIN_X5: 0 };

    const achievements = {

    let lastEatTime = 0;

    function renderShopUI() {
      shopGrid.innerHTML = '';
      Object.keys(SNAKE_SHOP_SKINS).forEach(key => {
        const item = SNAKE_SHOP_SKINS[key];
        const isUnlocked = unlockedSkins.includes(key);
        const isEquipped = equippedSkin === key;

        const card = document.createElement('div');
        card.className = `shop-item ${isEquipped ? 'equipped' : ''}`;

        let btnHTML = '';
        if (isEquipped) {
          btnHTML = `<button class="shop-item-btn equipped">Equipped</button>`;
        } else if (isUnlocked) {
          btnHTML = `<button class="shop-item-btn equip" onclick="equipSkin('${key}')">Equip</button>`;
        } else {
          btnHTML = `<button class="shop-item-btn buy" onclick="buySkin('${key}')">🪙 ${item.price}</button>`;
        }

        card.innerHTML = `
          <div class="snake-preview" style="background: linear-gradient(135deg, ${item.head}, ${item.body});"></div>
          <div class="shop-item-name">${item.name}</div>

      }

    function buySkin(key) {
      const item = SNAKE_SHOP_SKINS[key];
      if (coins >= item.price) {
        coins -= item.price;
        unlockedSkins.push(key);
        equippedSkin = key;
        localStorage.setItem('snake_unlocked_skins', JSON.stringify(unlockedSkins));
        localStorage.setItem('snake_equipped_skin', equippedSkin);

    function resetAchievements() {

        ach.el.classList.remove('unlocked');
      });
    }

    function checkAchievements(currentScore) {
      Object.keys(achievements).forEach(key => {

          ach.unlocked = true;
          ach.el.classList.add('unlocked');
          playSound('bonus');
        }
      });

    async function generateShareCard() {
      const cardCanvas = document.createElement('canvas');
      cardCanvas.width = 600;
      cardCanvas.height = 350;
      const cctx = cardCanvas.getContext('2d');

      const isLight = currentTheme === 'light';
      const grad = cctx.createLinearGradient(0, 0, 600, 350);
      grad.addColorStop(0, isLight ? '#f0f2f5' : '#0b0d14');
      grad.addColorStop(1, isLight ? '#ffffff' : '#121520');
      cctx.fillStyle = grad;
      cctx.fillRect(0, 0, 600, 350);

      cctx.strokeStyle = isLight ? '#d0d4dc' : '#2e3856';
      cctx.lineWidth = 6;
      cctx.strokeRect(3, 3, 594, 344);

      cctx.font = '900 36px sans-serif';
      cctx.fillStyle = '#00e676';
      cctx.textAlign = 'center';
      cctx.fillText('SNAKE HIGH SCORE', 300, 65);

      cctx.font = '900 68px sans-serif';
      cctx.fillStyle = '#ffd700';
      cctx.fillText(highScore, 300, 150);

      cctx.font = '600 16px sans-serif';
      cctx.fillStyle = isLight ? '#4b4c4f' : '#8d9bb0';
      cctx.fillText(`DIFFICULTY: ${selectedDifficulty.toUpperCase()}  |  WALLS: ${hasWalls ? 'ON' : 'OFF'}`, 300, 185);

      const gameUrl = window.location.href;
      const shareText = `🐍 I set a high score of ${highScore} points in Snake! Can you beat it?`;

      cardCanvas.toBlob(async (blob) => {
        const file = new File([blob], `snake-score-${highScore}.png`, { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ title: 'Snake High Score', text: shareText, url: gameUrl, files: [file] });
          } catch (e) {}
        } else {
          const link = document.createElement('a');
          link.download = `snake-score-${highScore}.png`;
          link.href = cardCanvas.toDataURL('image/png');
          link.click();
        }
      }, 'image/png');
    }

    function setDifficulty(diff) {
      selectedDifficulty = diff;
      document.querySelectorAll('#menu-settings .option-selector')[1]
        .querySelectorAll('.option-btn').forEach(btn => {
          btn.classList.toggle('active', btn.textContent.toLowerCase() === diff);
        });

      if (diff === 'easy') { stepInterval = 140; baseScoreValue = 5; }
      else if (diff === 'medium') { stepInterval = 90; baseScoreValue = 10; }
      else if (diff === 'hard') { stepInterval = 50; baseScoreValue = 15; }
    }

    function setWalls(enable) {
      hasWalls = enable;
      const btns = document.querySelectorAll('#menu-settings .option-selector')[2].querySelectorAll('.option-btn');
      btns[0].classList.toggle('active', enable);
      btns[1].classList.toggle('active', !enable);
    }

    function initIntro() {
      isIntro = true;
      introSnake = [{ x: 5, y: 10 }, { x: 4, y: 10 }, { x: 3, y: 10 }, { x: 2, y: 10 }];
      introDir = { x: 1, y: 0 };
      requestAnimationFrame(introLoop);
    }

    function initGame() {
      snake = [{ x: 10, y: 10 }, { x: 10, y: 11 }, { x: 10, y: 12 }];
      dir = { x: 0, y: -1 };
      nextDir = { x: 0, y: -1 };
      score = 0;
      ateCount = 0;
      comboCount = 0;
      lastEatTime = performance.now();
      resetComboUI();
      resetAchievements();
      clearActiveBuffs();
      clearPowerupItem();
      isPaused = false;
      clearBonusFood();
      clearBlink();
      particles = [];
      floatingTexts = [];
      scoreEl.textContent = score;
      placeFood();
    }

    function placeFood() {
      while (true) {
        food.x = Math.floor(Math.random() * TILE_COUNT);
        food.y = Math.floor(Math.random() * TILE_COUNT);
        let collide = snake.some(s => s.x === food.x && s.y === food.y);
        if (!collide) break;
      }
    }

    function spawnBonusFood() {
      while (true) {
        let bx = Math.floor(Math.random() * TILE_COUNT);
        let by = Math.floor(Math.random() * TILE_COUNT);
        let collide = snake.some(s => s.x === bx && s.y === by) || 
                      (food.x === bx && food.y === by) ||
                      (activePowerupItem && activePowerupItem.x === bx && activePowerupItem.y === by);
        if (!collide) { bonusFood = { x: bx, y: by }; break; }
      }
      clearTimeout(bonusTimer);
      bonusTimer = setTimeout(() => { bonusFood = null; }, 5000);
    }

    function clearBonusFood() {
      bonusFood = null;
      clearTimeout(bonusTimer);
    }

    function spawnPowerupItem() {
      const keys = Object.keys(POWERUP_TYPES);
      const chosenKey = keys[Math.floor(Math.random() * keys.length)];
      const puType = POWERUP_TYPES[chosenKey];

      let px, py;
      while (true) {
        px = Math.floor(Math.random() * TILE_COUNT);
        py = Math.floor(Math.random() * TILE_COUNT);
        let collide = snake.some(s => s.x === px && s.y === py) ||
                      (food.x === px && food.y === py) ||
                      (bonusFood && bonusFood.x === px && bonusFood.y === py);
        if (!collide) break;
      }

      activePowerupItem = { x: px, y: py, ...puType };
      clearTimeout(powerupDespawnTimer);
      powerupDespawnTimer = setTimeout(() => { activePowerupItem = null; }, puType.despawn);
    }

    function clearPowerupItem() {
      activePowerupItem = null;
      clearTimeout(powerupDespawnTimer);
    }

    function activatePowerupBuff(typeKey) {
      const now = performance.now();
      const puDef = POWERUP_TYPES[typeKey];
      activeBuffs[typeKey] = now + puDef.duration;
      clearPowerupItem();
      playSound('powerup');
    }

    function clearActiveBuffs() {
      activeBuffs = { SCORE_X10: 0, GHOST: 0, COIN_X5: 0 };
      updatePowerupUI();
    }

    function updatePowerupUI() {
      const now = performance.now();
      let html = '';
      Object.keys(POWERUP_TYPES).forEach(key => {
        if (activeBuffs[key] > now) {
          const remainingSec = Math.ceil((activeBuffs[key] - now) / 1000);
          const def = POWERUP_TYPES[key];
          html += `
            <div class="powerup-active-badge">
              <span>${def.icon} ${def.label}</span>
              <span class="pu-timer">${remainingSec}s</span>
            </div>
          `;
        }
      });
      powerupBar.innerHTML = html;
    }

    function triggerBlinkEffect() {
      isBlinking = true;
      clearTimeout(blinkTimer);
      blinkTimer = setTimeout(() => { isBlinking = false; }, 3000);
    }

    function clearBlink() {
      isBlinking = false;
      clearTimeout(blinkTimer);
    }

    function resetComboUI() {
      comboDisplay.textContent = "";
      comboGauge.style.width = "0%";
      comboDisplay.classList.remove('pulse-active');
    }

    function updateComboGauge() {
      if (!isRunning || isPaused || comboCount === 0) {
        if (comboCount === 0) resetComboUI();
        return;
      }

      const elapsed = performance.now() - lastEatTime;
      const remaining = COMBO_WINDOW - elapsed;

      if (remaining <= 0) {
        comboCount = 0;
        resetComboUI();
      } else {
        const percentage = (remaining / COMBO_WINDOW) * 100;
        comboGauge.style.width = `${percentage}%`;
        comboDisplay.textContent = `${comboCount}x COMBO!`;
        
        // Trigger smooth green pulsing effect when combo multiplier is active (>= 2x)
        if (comboCount >= 2) {
          comboDisplay.classList.add('pulse-active');
        } else {
          comboDisplay.classList.remove('pulse-active');
        }
      }
    }

    function handlePrimaryAction() {
      if (!isRunning) startGame();
      else if (isPaused) resumeGame();
    }

    function startGame() {
      isIntro = false;
      isRunning = true;
      isPaused = false;
      
      overlay.classList.add('hidden');
      achievementsBar.classList.add('active');
      homeBtn.style.display = 'none';

      initGame();
      lastStepTime = performance.now();
      requestAnimationFrame(gameLoop);
    }

    function pauseGame() {
      if (!isRunning || isPaused) return;
      isPaused = true;

      overlayTitle.textContent = "PAUSED";
      startBtn.textContent = "Resume";
      menuSettings.style.display = 'none';
      openShopBtn.style.display = 'none';
      homeBtn.style.display = 'block';
      overlay.classList.remove('hidden');
    }

    function resumeGame() {
      isPaused = false;
      overlay.classList.add('hidden');
      lastStepTime = performance.now();
      requestAnimationFrame(gameLoop);
    }

    function returnToHome() {
      isRunning = false;
      isPaused = false;

      overlayTitle.textContent = "SNAKE";
      startBtn.textContent = "Start Game";
      menuSettings.style.display = 'flex';
      openShopBtn.style.display = 'block';
      homeBtn.style.display = 'none';
      achievementsBar.classList.remove('active');

      resetComboUI();
      clearActiveBuffs();
      overlay.classList.remove('hidden');
      initIntro();
    }

    function gameOver() {
      isRunning = false;
      playSound('gameover');

      canvasWrapper.classList.add('shake');
      setTimeout(() => canvasWrapper.classList.remove('shake'), 400);

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('snake_high_score', highScore);
        updateHighScoreUI();
      }

      overlayTitle.textContent = "GAME OVER";
      startBtn.textContent = "Play Again";
      menuSettings.style.display = 'flex';
      openShopBtn.style.display = 'block';
      homeBtn.style.display = 'none';
      achievementsBar.classList.remove('active');

      overlay.classList.remove('hidden');
      initIntro();
    }

    function gameLoop(time) {
      if (!isRunning || isPaused) return;

      updateComboGauge();
      updatePowerupUI();

      if (time - lastStepTime >= stepInterval) {
        lastStepTime = time;
        step();
      }

      draw();
      if (isRunning && !isPaused) {
        requestAnimationFrame(gameLoop);
      }
    }

    function step() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      if (hasWalls) {
        if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
          gameOver();
          return;
        }
      } else {
        if (head.x < 0) head.x = TILE_COUNT - 1;
        if (head.x >= TILE_COUNT) head.x = 0;
        if (head.y < 0) head.y = TILE_COUNT - 1;
        if (head.y >= TILE_COUNT) head.y = 0;
      }

      const isGhostActive = activeBuffs.GHOST > performance.now();
      if (!isGhostActive) {
        const selfHit = snake.some(s => s.x === head.x && s.y === head.y);
        if (selfHit) {
          gameOver();
          return;
        }
      }

      snake.unshift(head);

      let ate = false;
      const now = performance.now();

      if (head.x === food.x && head.y === food.y) {
        ate = true;
        ateCount++;
        playSound('eat');

        if (now - lastEatTime <= COMBO_WINDOW) comboCount++;
        else comboCount = 1;
        lastEatTime = now;

        let multiplier = 1;
        if (activeBuffs.SCORE_X10 > now) multiplier *= 10;
        if (comboCount > 1) multiplier *= comboCount;

        const earnedScore = baseScoreValue * multiplier;
        score += earnedScore;
        scoreEl.textContent = score;

        spawnParticles(food.x, food.y, '#f44336', 12);
        spawnFloatingText(food.x, food.y, `+${earnedScore}`, '#00e676');

        let earnedCoins = 1;
        if (activeBuffs.COIN_X5 > now) earnedCoins *= 5;
        coins += earnedCoins;
        updateCoinsUI();

        checkAchievements(score);
        placeFood();

        if (ateCount % 5 === 0) {
          spawnBonusFood();
          spawnPowerupItem();
        }
      } 
      else if (bonusFood && head.x === bonusFood.x && head.y === bonusFood.y) {
        ate = true;
        playSound('bonus');
        let multiplier = activeBuffs.SCORE_X10 > now ? 10 : 1;
        const earnedScore = (baseScoreValue * 3) * multiplier;
        score += earnedScore;
        coins += (activeBuffs.COIN_X5 > now ? 15 : 3);
        
        spawnParticles(bonusFood.x, bonusFood.y, '#ff9800', 16);
        spawnFloatingText(bonusFood.x, bonusFood.y, `+${earnedScore}`, '#ffd700');

        scoreEl.textContent = score;
        updateCoinsUI();
        checkAchievements(score);
        clearBonusFood();
        triggerBlinkEffect();
      }
      else if (activePowerupItem && head.x === activePowerupItem.x && head.y === activePowerupItem.y) {
        spawnParticles(activePowerupItem.x, activePowerupItem.y, activePowerupItem.color, 16);
        spawnFloatingText(activePowerupItem.x, activePowerupItem.y, activePowerupItem.label, activePowerupItem.color);
        activatePowerupBuff(activePowerupItem.type);
        triggerBlinkEffect();
      }

      if (!ate) {
        snake.pop();
      }
    }

    function drawGrid() {
      const gridColor = getComputedStyle(document.documentElement).getPropertyValue('--grid-line').trim();
      ctx.strokeStyle = gridColor;
      ctx.lineWidth = 0.5;

      for (let i = 0; i <= canvas.width; i += GRID_SIZE) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawGrid();

      ctx.fillStyle = '#f44336';
      ctx.shadowColor = '#f44336';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc((food.x + 0.5) * GRID_SIZE, (food.y + 0.5) * GRID_SIZE, GRID_SIZE / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      if (bonusFood) {
        ctx.fillStyle = '#ff9800';
        ctx.shadowColor = '#ff9800';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc((bonusFood.x + 0.5) * GRID_SIZE, (bonusFood.y + 0.5) * GRID_SIZE, GRID_SIZE / 2 - 1, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      if (activePowerupItem) {
        ctx.shadowColor = activePowerupItem.color;
        ctx.shadowBlur = 14;
        ctx.font = `${GRID_SIZE - 2}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(activePowerupItem.icon, (activePowerupItem.x + 0.5) * GRID_SIZE, (activePowerupItem.y + 0.5) * GRID_SIZE + 1);
        ctx.shadowBlur = 0;
      }

      const skin = SNAKE_SHOP_SKINS[equippedSkin] || SNAKE_SHOP_SKINS.green;
      const isGhost = activeBuffs.GHOST > performance.now();

      snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? skin.head : skin.body;
        
        if (isGhost) ctx.globalAlpha = 0.4;

        if (index === 0) {
          ctx.shadowColor = skin.head;
          ctx.shadowBlur = isBlinking ? 16 : 8;
        }

        ctx.beginPath();
        ctx.roundRect(
          part.x * GRID_SIZE + 1, 
          part.y * GRID_SIZE + 1, 
          GRID_SIZE - 2, 
          GRID_SIZE - 2, 
          index === 0 ? 6 : 4
        );
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1.0;
      });

      updateAndDrawFX();
    }

    function introLoop(time) {
      if (!isIntro) return;

      if (time - lastIntroStep >= 180) {
        lastIntroStep = time;
        const head = { x: introSnake[0].x + introDir.x, y: introSnake[0].y + introDir.y };

        if (head.x >= TILE_COUNT - 2) introDir = { x: 0, y: 1 };
        else if (head.y >= TILE_COUNT - 2) introDir = { x: -1, y: 0 };
        else if (head.x <= 1) introDir = { x: 0, y: -1 };
        else if (head.y <= 1) introDir = { x: 1, y: 0 };

        introSnake.unshift({ x: introSnake[0].x + introDir.x, y: introSnake[0].y + introDir.y });
        introSnake.pop();
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawGrid();

      const skin = SNAKE_SHOP_SKINS[equippedSkin] || SNAKE_SHOP_SKINS.green;
      introSnake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? skin.head : skin.body;
        ctx.globalAlpha = 0.3;
        ctx.beginPath();
        ctx.roundRect(part.x * GRID_SIZE + 1, part.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2, 4);
        ctx.fill();
        ctx.globalAlpha = 1.0;
      });

      if (isIntro) requestAnimationFrame(introLoop);
    }

    function handleDirectionInput(newDir) {
      if (!isRunning) return;
      if (isPaused) resumeGame();
      if (newDir.x === -dir.x && newDir.y === -dir.y) return;
      nextDir = newDir;
    }

    window.addEventListener('keydown', (e) => {
      switch (e.key) {
        case 'ArrowUp': case 'w': case 'W': handleDirectionInput({ x: 0, y: -1 }); break;
        case 'ArrowDown': case 's': case 'S': handleDirectionInput({ x: 0, y: 1 }); break;
        case 'ArrowLeft': case 'a': case 'A': handleDirectionInput({ x: -1, y: 0 }); break;
        case 'ArrowRight': case 'd': case 'D': handleDirectionInput({ x: 1, y: 0 }); break;
        case 'Escape':
        case ' ':
        case 'p':
        case 'P':
          if (isRunning) {
            isPaused ? resumeGame() : pauseGame();
          }
          break;
      }
    });

    document.getElementById('btn-up').addEventListener('click', () => handleDirectionInput({ x: 0, y: -1 }));
    document.getElementById('btn-down').addEventListener('click', () => handleDirectionInput({ x: 0, y: 1 }));
    document.getElementById('btn-left').addEventListener('click', () => handleDirectionInput({ x: -1, y: 0 }));
    document.getElementById('btn-right').addEventListener('click', () => handleDirectionInput({ x: 1, y: 0 }));

    let touchStartX = 0;
    let touchStartY = 0;

    canvas.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    canvas.addEventListener('touchend', (e) => {
      if (!touchStartX || !touchStartY) return;
      let dx = e.changedTouches[0].clientX - touchStartX;
      let dy = e.changedTouches[0].clientY - touchStartY;

      if (Math.abs(dx) > Math.abs(dy)) {
        if (Math.abs(dx) > 20) handleDirectionInput(dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 });
      } else {
        if (Math.abs(dy) > 20) handleDirectionInput(dy > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 });
      }

      touchStartX = 0;
      touchStartY = 0;
    }, { passive: true });

    initIntro();
  </script>
</body>
</html>
